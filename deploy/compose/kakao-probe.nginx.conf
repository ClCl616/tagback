events {}
http {
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 32k;
    limit_req_zone $binary_remote_addr zone=probe:1m rate=10r/s;
    server {
        listen 8080;
        location = /api/v1/dev/kakao/skill-probe {
            limit_except POST { deny all; }
            limit_req zone=probe burst=10 nodelay;
            proxy_pass http://api:8080;
            proxy_connect_timeout 2s;
            proxy_read_timeout 4s;
        }
        location = /api/v1/dev/kakao/identity-probe {
            limit_except POST { deny all; }
            limit_req zone=probe burst=10 nodelay;
            proxy_pass http://api:8080;
            proxy_connect_timeout 2s;
            proxy_read_timeout 4s;
        }
        location / { return 404; }
    }
}
