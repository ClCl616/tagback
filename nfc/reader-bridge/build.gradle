plugins {
    id 'java'
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:6.0.3'
}

application {
    mainClass = 'com.tagback.nfc.bridge.BridgeMain'
    applicationDefaultJvmArgs = ['--add-modules=java.smartcardio,jdk.httpserver']
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--add-modules', 'java.smartcardio,jdk.httpserver']
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--add-modules=java.smartcardio,jdk.httpserver'
}
