spring.application.name=tagback
tagback.nfc.scan-secret=${NFC_SCAN_SECRET:}
tagback.nfc.bridge-id=${NFC_BRIDGE_ID:}

spring.datasource.url=jdbc:postgresql://localhost:5432/tagback
spring.datasource.username=tagback_user
spring.datasource.password=${TAGBACK_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

# Service sessions are independent of Kakao access-token expiry.
tagback.auth.session-idle-timeout=30m
tagback.auth.session-absolute-timeout=8h
# OAuth properties are supplied through environment/configtree; no credentials in Git.
