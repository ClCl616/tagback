spring.application.name=tagback

spring.datasource.url=jdbc:postgresql://localhost:5432/tagback
spring.datasource.username=tagback_user
spring.datasource.password=${TAGBACK_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

# Authentication policy (enforcement is implemented in subsequent stages)
tagback.auth.sms-code-ttl=5m
tagback.auth.sms-resend-interval=1m
tagback.auth.sms-max-attempts=5
tagback.auth.sms-request-window=24h
tagback.auth.sms-max-requests=10
tagback.auth.verification-ttl=10m
tagback.auth.session-idle-timeout=30m
tagback.auth.session-absolute-timeout=8h
tagback.auth.browser-registration-ttl=30d
tagback.auth.reauthentication-ttl=5m
tagback.auth.pin-first-wait=30s
tagback.auth.pin-second-wait=1m
tagback.auth.pin-third-wait=5m
