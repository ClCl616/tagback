# Opt in with spring.profiles.active=sms-mock. Mock endpoints are disabled in prod/production.
# This fallback is for local mock development only; real SMS must use a managed secret.
tagback.auth.sms-hash-key=${TAGBACK_SMS_HASH_KEY:tagback-local-mock-only-key-change-me}

# Initial development limits for kiosk rental code authentication; tune before deployment.
tagback.rental.verify-per-address-per-minute=10
tagback.rental.verify-global-per-minute=60
tagback.rental.new-codes-per-user-per-hour=10
